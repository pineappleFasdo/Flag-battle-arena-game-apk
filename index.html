<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: canvas fills behind notch/home-indicator on all phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Prevent iOS from treating phone numbers as links -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Theme color for Android status bar -->
    <meta name="theme-color" content="#0a0b10" />
    <!-- Fullscreen PWA / Capacitor hints -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Orbitron: gaming / sci-fi font for all UI text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>National Royale</title>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
